# Native Ubuntu installation, PHP 8.3 FPM. Adjust server_name, paths, TLS and socket.
server {
    listen 80;
    server_name dbadmin.example.it;
    root /var/www/adminermyadmin/public;
    index index.php;
    client_max_body_size 68m;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 130s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
